[package]
name = "receiver"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "receiver"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio          = { version = "1", features = ["full"] }
tokio-rustls   = "0.26"

# TLS / crypto
rustls         = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"

# NaCl SealedBox — manual implementation matching libsodium crypto_box_seal
x25519-dalek     = { version = "2", features = ["static_secrets"] }
blake2           = "0.10"
xsalsa20poly1305 = "0.9"

# ChaCha20-Poly1305 AEAD (matches Python ChaCha20Poly1305)
chacha20poly1305 = "0.10"

# Base64 (matches Python base64.b64decode / b64encode)
base64         = "0.22"

# JSON
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"

# Logging
tracing              = "0.1"
tracing-subscriber   = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
anyhow  = "1"
chrono  = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto       = true